name: Release

# Push a tag like `v0.2.0` to build every Linux package and publish a GitHub Release.
# "Run workflow" from the Actions tab builds the same artifacts without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps the glibc requirement low (2.35), so the binaries run
          # on most current distributions. Both architectures build natively.
          - arch: x86_64
            runner: ubuntu-22.04
            deb_arch: amd64
          - arch: aarch64
            runner: ubuntu-22.04-arm
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    # A hung test (e.g. a deadlock regression) must not burn the 6-hour default.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev build-essential curl wget file patchelf xdg-utils

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      # Vite 8 needs Node 20.19+; the app's frontend is built by `cargo tauri build`.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            # Stamp the tag's version into the workspace so binaries and packages agree.
            sed -i "0,/^version = \".*\"/s//version = \"$version\"/" Cargo.toml
          else
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

      - name: Run tests
        run: cargo test -p gdrive-core

      - name: Build daemon and CLI
        run: cargo build --release -p gdrived -p gdrive-cli

      # Packages the headless gdrive-linux-cli .deb and .rpm (packaging/nfpm-cli.yaml).
      - name: Install nfpm
        env:
          NFPM_VERSION: 2.47.0
        run: |
          case "$(uname -m)" in x86_64) a=x86_64 ;; aarch64) a=arm64 ;; esac
          tarball="nfpm_${NFPM_VERSION}_Linux_$a.tar.gz"
          base="https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION"
          cd "$RUNNER_TEMP"
          curl -sSfLO "$base/$tarball"
          curl -sSfLO "$base/checksums.txt"
          sha256sum --ignore-missing -c checksums.txt
          sudo tar -xzf "$tarball" -C /usr/local/bin nfpm
          nfpm --version

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - name: Bundle AppImage, deb and rpm
        env:
          # linuxdeploy is itself an AppImage; let it self-extract instead of needing FUSE.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        run: |
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p app/src-tauri/binaries
          cp target/release/gdrived "app/src-tauri/binaries/gdrived-$triple"
          cp target/release/gdrive "app/src-tauri/binaries/gdrive-$triple"
          cd app/src-tauri
          cargo tauri build --config tauri.bundle.conf.json --bundles appimage,deb,rpm

      - name: Collect artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p out
          bundle=target/release/bundle
          cp "$(ls $bundle/appimage/*.AppImage | head -1)" "out/gdrive-linux-$VERSION-$ARCH.AppImage"
          cp $bundle/deb/*.deb out/
          cp $bundle/rpm/*.rpm out/

          # Headless options: just the daemon and CLI, plus the systemd user unit, as
          # packages and as a tarball.
          scripts/cli-packages.sh out
          stage="gdrive-linux-$VERSION-$ARCH-cli"
          mkdir -p "$stage"
          cp target/release/gdrived target/release/gdrive "$stage/"
          cp packaging/gdrived.service README.md "$stage/"
          tar -czf "out/$stage.tar.gz" "$stage"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: out
          merge-multiple: true

      - name: Checksums
        run: |
          cd out
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Downloads

            | File | For |
            |---|---|
            | `gdrive-linux-*-x86_64.AppImage` / `-aarch64.AppImage` | Any distro: `chmod +x` and run. Includes the app, daemon (`--daemon`) and CLI (`--cli`). |
            | `gdrive-linux_*_amd64.deb` / `_arm64.deb` | Debian, Ubuntu, Mint, Pop!_OS |
            | `gdrive-linux-*.x86_64.rpm` / `.aarch64.rpm` | Fedora, openSUSE, RHEL |
            | `gdrive-linux-cli_*_amd64.deb` / `_arm64.deb` | Terminal only (no window or tray, no WebKitGTK), for Debian/Ubuntu servers and desktops |
            | `gdrive-linux-cli-*.x86_64.rpm` / `.aarch64.rpm` | Terminal only, for Fedora, openSUSE, RHEL |
            | `gdrive-linux-*-cli.tar.gz` | Terminal only, any distro: `gdrived` + `gdrive` + systemd user unit |

            The desktop and terminal-only packages replace each other: install one or the other.

            First run: create a Google OAuth "Desktop app" client, then paste its ID and secret into the app (or run `gdrive config client <id> <secret>`). See the [README](https://github.com/${{ github.repository }}#1-create-a-google-oauth-client-one-time-5-minutes).
